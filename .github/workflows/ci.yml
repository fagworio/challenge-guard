name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8,<9"
      - name: Tests (nucleo puro, sem browser)
        run: pytest -q -m "not integration"
      - name: Compile
        run: python -m compileall -q src

  dependency-isolation:
    # CG-010 / CG-A01: `import challenge_guard` tem de funcionar num ambiente onde
    # browser nem existe. Este job instala SO o pacote — se alguem colocar
    # playwright/seleniumbase em `dependencies`, aqui quebra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8,<9"
      - name: No browser dependency may be importable
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("playwright", "seleniumbase", "selenium", "mycdp"):
              assert importlib.util.find_spec(name) is None, f"{name} instalado neste job"
          print("ambiente sem browser: ok")
          PY
      - name: Importing the package loads nothing optional
        run: pytest -q tests/unit/test_dependency_isolation.py

  architecture:
    # CG-027/CG-031/CG-034: as fronteiras que o import-linter nao ve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=8,<9"
      - name: Guards (AST + selfcheck dos proprios guards)
        run: pytest -q tests/unit/test_architecture_guards.py

  integration:
    # CG-035: a mesma decisao com Playwright direto e com Playwright sobre CDP
    # (Chrome lancado por fora). Nao instala SeleniumBase: o lancador e do host, e
    # o medidor cobre o caminho do Chrome comum.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[playwright]" "pytest>=8,<9"
      - name: Chromium
        run: python -m playwright install --with-deps chromium
      - name: Integration
        run: pytest -q tests/integration
      - name: Backend parity (mesma decisao em dois lancadores)
        run: python tools/measure_backends.py

  boundary:
    # A fronteira do projeto e a ausencia de capacidades: se uma funcao de
    # resolver/contornar aparecer, o build quebra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No solving or evasion API may exist
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          banned = ("solve", "bypass", "stealth", "answer_captcha", "inject_token", "spoof", "undetected")
          offenders = []
          for source in pathlib.Path("src").rglob("*.py"):
              tree = ast.parse(source.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                      name = node.name.casefold()
                      if any(token in name for token in banned):
                          offenders.append(f"{source}:{node.lineno} {node.name}")
          if offenders:
              print("boundary violation:", *offenders, sep="\n  ")
              sys.exit(1)
          print("boundary intact")
          PY
      - name: No non-neutral browser dependency in the package
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          banned = {"seleniumbase", "selenium", "undetected"}
          offenders = []
          for source in pathlib.Path("src").rglob("*.py"):
              tree = ast.parse(source.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      offenders += [
                          f"{source}:{node.lineno} {a.name}" for a in node.names if a.name.split(".")[0] in banned
                      ]
                  elif isinstance(node, ast.ImportFrom) and (node.module or "").split(".")[0] in banned:
                      offenders.append(f"{source}:{node.lineno} {node.module}")
          if offenders:
              print("forbidden dependency:", *offenders, sep="\n  ")
              sys.exit(1)
          print("launcher stays outside the package")
          PY
